<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 76" shape-rendering="crispEdges">
  <rect width="76" height="76" fill="#07090C"/>
  <g fill="#C7F050">
    <!-- horizontal arm, 7 tiles across center row -->
    <rect x="0"  y="33" width="10" height="10"/>
    <rect x="11" y="33" width="10" height="10"/>
    <rect x="22" y="33" width="10" height="10"/>
    <rect x="33" y="33" width="10" height="10"/>
    <rect x="44" y="33" width="10" height="10"/>
    <rect x="55" y="33" width="10" height="10"/>
    <rect x="66" y="33" width="10" height="10"/>
    <!-- vertical arm, 6 additional tiles (center already drawn above) -->
    <rect x="33" y="0"  width="10" height="10"/>
    <rect x="33" y="11" width="10" height="10"/>
    <rect x="33" y="22" width="10" height="10"/>
    <rect x="33" y="44" width="10" height="10"/>
    <rect x="33" y="55" width="10" height="10"/>
    <rect x="33" y="66" width="10" height="10"/>
  </g>
</svg>
